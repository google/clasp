# GitHub Secret Scanning Exclusions
#
# Exclude src/auth/oauth_client.ts because DEFAULT_CLASP_OAUTH_CLIENT_SECRET
# is a hardcoded, public OAuth secret for the default desktop OAuth 2.0 client.
# Google Identity OAuth 2.0 requires desktop apps to provide a client secret
# during authorization exchange, even though it is not a confidential client.
paths-ignore:
  - "src/auth/oauth_client.ts"
